<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yunus Coaching - Result Portal</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans Bengali",sans-serif;background:#f3f6fb;color:#172033}
.container{max-width:520px;margin:0 auto;padding:20px}
.card{background:white;border-radius:18px;padding:24px;box-shadow:0 8px 30px #00000012;margin-top:30px}
h1{text-align:center;margin:0 0 6px}
.sub{text-align:center;color:#667085;margin-bottom:24px}
label{display:block;font-weight:700;margin:14px 0 7px}
input,select,button{width:100%;padding:13px;border-radius:10px;font-size:16px}
input,select{border:1px solid #d0d5dd}
button{border:0;background:#2563eb;color:white;font-weight:700;margin-top:18px;cursor:pointer}
button:hover{opacity:.92}
#error{color:#c62828;text-align:center;margin-top:14px;font-weight:600}
#result{display:none}
.info{background:#f8fafc;border-radius:12px;padding:14px;margin:14px 0}
.info p{margin:7px 0}
table{width:100%;border-collapse:collapse;margin-top:15px}
th,td{padding:11px 7px;border-bottom:1px solid #e5e7eb;text-align:left}
th{background:#f8fafc}
.total{font-weight:800;font-size:18px}
.back{background:#475467}
</style>
</head>
<body>
<div class="container">

<div class="card" id="login">
  <h1>Yunus Coaching</h1>
  <div class="sub">Result Portal</div>

  <label for="name">শিক্ষার্থীর নাম</label>
  <input id="name" type="text" placeholder="নাম লিখুন">

  <label for="code">রেজাল্ট কোড</label>
  <input id="code" type="text" placeholder="কোড লিখুন">

  <button onclick="showResult()">রেজাল্ট দেখুন</button>
  <div id="error"></div>
</div>

<div class="card" id="result">
  <h1>Yunus Coaching</h1>
  <div class="sub">পরীক্ষার ফলাফল</div>
  <div class="info">
    <p><b>নাম:</b> <span id="rName"></span></p>
    <p><b>কোড:</b> <span id="rCode"></span></p>
  </div>

  <label for="exam">পরীক্ষা নির্বাচন করুন</label>
  <select id="exam" onchange="renderExam()"></select>

  <table>
    <thead><tr><th>বিষয়</th><th>প্রাপ্ত</th><th>পূর্ণ</th></tr></thead>
    <tbody id="marks"></tbody>
  </table>

  <div class="info">
    <p class="total">মোট: <span id="total"></span></p>
    <p><b>ফলাফল:</b> <span id="status"></span></p>
  </div>

  <button class="back" onclick="goBack()">অন্য রেজাল্ট দেখুন</button>
</div>

</div>

<script>
// ডেমো ডাটা — পরে এখানে আসল ছাত্রদের তথ্য বসানো যাবে।
const students = [
  {
    name: "রহিম",
    code: "YC1001",
    exams: {
      "সাপ্তাহিক পরীক্ষা": {
        "বাংলা": [78,100], "ইংরেজি": [82,100], "গণিত": [91,100],
        "বিজ্ঞান": [76,100], "বাংলাদেশ ও বিশ্বপরিচয়": [80,100],
        "ধর্ম ও নৈতিক শিক্ষা": [85,100]
      }
    }
  },
  {
    name: "করিম",
    code: "YC1002",
    exams: {
      "মাসিক পরীক্ষা": {
        "বাংলা": [85,100], "ইংরেজি": [79,100], "গণিত": [88,100],
        "বিজ্ঞান": [81,100], "বাংলাদেশ ও বিশ্বপরিচয়": [84,100],
        "ধর্ম ও নৈতিক শিক্ষা": [90,100]
      },
      "প্রি-টেস্ট": {
        "বাংলা": [88,100], "ইংরেজি": [83,100], "গণিত": [92,100],
        "বিজ্ঞান": [86,100], "বাংলাদেশ ও বিশ্বপরিচয়": [87,100],
        "ধর্ম ও নৈতিক শিক্ষা": [91,100]
      }
    }
  }
];

let currentStudent;

function showResult(){
  const name = document.getElementById("name").value.trim();
  const code = document.getElementById("code").value.trim();
  const found = students.find(s => s.name === name && s.code === code);

  if(!found){
    document.getElementById("error").textContent =
      "নাম অথবা কোড সঠিক নয়।";
    return;
  }

  currentStudent = found;
  document.getElementById("error").textContent = "";
  document.getElementById("rName").textContent = found.name;
  document.getElementById("rCode").textContent = found.code;

  const select = document.getElementById("exam");
  select.innerHTML = "";
  Object.keys(found.exams).forEach(exam=>{
    const opt=document.createElement("option");
    opt.value=exam; opt.textContent=exam;
    select.appendChild(opt);
  });

  document.getElementById("login").style.display="none";
  document.getElementById("result").style.display="block";
  renderExam();
}

function renderExam(){
  const exam = document.getElementById("exam").value;
  const data = currentStudent.exams[exam];
  const tbody = document.getElementById("marks");
  tbody.innerHTML="";
  let total=0, full=0;

  Object.entries(data).forEach(([subject, marks])=>{
    total += marks[0]; full += marks[1];
    const tr=document.createElement("tr");
    tr.innerHTML=`<td>${subject}</td><td>${marks[0]}</td><td>${marks[1]}</td>`;
    tbody.appendChild(tr);
  });

  document.getElementById("total").textContent = `${total} / ${full}`;
  document.getElementById("status").textContent =
    total >= full*0.33 ? "উত্তীর্ণ" : "অনুত্তীর্ণ";
}

function goBack(){
  document.getElementById("result").style.display="none";
  document.getElementById("login").style.display="block";
  document.getElementById("name").value="";
  document.getElementById("code").value="";
}
</script>
</body>
</html>
