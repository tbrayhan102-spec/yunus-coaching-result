<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Yunush Science Corner - Result Portal</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:#eef6ff;
  color:#123b67;
}

/* ব্যানার */
.hero img{
  width:100%;
  display:block;
}

/* মেনু */
.nav{
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
  background:#07376f;
  padding:10px;
}

.nav button{
  border:0;
  border-radius:12px;
  padding:13px 18px;
  background:#0877ee;
  color:white;
  font-weight:bold;
  font-size:16px;
}

/* মূল অংশ */
.wrap{
  max-width:1000px;
  margin:auto;
  padding:20px 14px;
}

.title{
  text-align:center;
  color:#1459a0;
  font-size:32px;
}

.sub{
  text-align:center;
  font-size:18px;
}

/* কার্ড */
.card{
  background:white;
  border-radius:20px;
  padding:20px;
  margin:18px 0;
  box-shadow:0 8px 30px #9ab4d455;
}

/* ইনপুট */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

label{
  font-weight:bold;
  display:block;
  margin:5px 0;
}

select,
input{
  width:100%;
  padding:14px;
  border:2px solid #d8e7f7;
  border-radius:12px;
  font-size:16px;
}

/* বাটন */
.search{
  width:100%;
  margin-top:15px;
  padding:15px;
  border:0;
  border-radius:13px;
  background:#0877ee;
  color:white;
  font-size:18px;
  font-weight:bold;
}

/* রেজাল্ট */
.result{
  display:none;
  background:#f7fffb;
  border:2px solid #a9ead0;
}

.resultGrid{
  display:grid;
  grid-template-columns:180px 1fr;
  gap:20px;
}

.profile{
  width:160px;
  height:160px;
  object-fit:cover;
  border-radius:50%;
  border:5px solid #18a67a;
}

/* টেবিল */
table{
  width:100%;
  border-collapse:collapse;
  background:white;
}

td{
  padding:11px;
  border-bottom:1px solid #dce8f2;
  font-size:16px;
}

td:first-child{
  font-weight:bold;
  width:55%;
}

.ok{
  background:#18a974;
  color:white;
  padding:7px 12px;
  border-radius:20px;
  font-size:14px;
}

/* Footer */
footer{
  background:#062d5b;
  color:white;
  text-align:center;
  padding:22px;
}

/* মোবাইল */
@media(max-width:650px){

  .grid,
  .resultGrid{
    grid-template-columns:1fr;
  }

  .profile{
    width:130px;
    height:130px;
  }

  .title{
    font-size:26px;
  }

}
</style>

</head>

<body>

<!-- ব্যানার -->
<div class="hero">
  <img src="file_00000000a52c8207aeb549a1f992d494~2.jpg"
       alt="Yunush Science Corner">



<div class="wrap">

<h1 class="title">
🎓 Result Portal
</h1>

<p class="sub">
রেজাল্ট দেখতে প্রতিষ্ঠান, বিভাগ, নাম ও কোড দিন
</p>


<!-- লগইন -->
<div class="card">

<div class="grid">

<div>

<label>প্রতিষ্ঠান</label>

<select id="type">

<option value="">
নির্বাচন করুন
</option>

<option value="School">
School
</option>

</select>

</div>


<div>

<label>বিভাগ</label>

<select id="dept">

<option value="">
নির্বাচন করুন
</option>

<option value="Science">
Science
</option>

<option value="Arts">
Arts
</option>

</select>

</div>


<div>

<label>
শিক্ষার্থীর নাম
</label>

<input
id="name"
placeholder="যেমন: rayhan"
>

</div>


<div>

<label>
রেজাল্ট কোড
</label>

<input
id="code"
placeholder="যেমন: 4378"
>

</div>

</div>


<button
class="search"
onclick="showResult()">

🔎 রেজাল্ট দেখুন

</button>


<p id="msg"></p>

</div>


<!-- রেজাল্ট -->
<div
class="card result"
id="result">

<h2>

🎓 রেজাল্ট

<span class="ok">
✓ সফল
</span>

</h2>


<div class="resultGrid">


<!-- ছবি -->
<div>

<img
class="profile"
src="FB_IMG_1789065372760.jpg"
alt="Profile"
>

<p>
<b>
Yunush Science Corner
</b>
</p>

<p>
শিখি ✓ জানি ✓ এগিয়ে যাই
</p>

</div>


<!-- নম্বর -->
<table id="marks">

</table>


</div>

</div>

</div>


<footer>

© 2026 Yunush Science Corner.
All rights reserved.

</footer>



<script>

/* ১৬ জন শিক্ষার্থী */

const students = [

  {name:"ehsa",code:"5832"},

  {name:"mira",code:"9147"},

  {name:"alamin",code:"3265"},

  {name:"muktadir",code:"7481"},

  {name:"bably",code:"2059"},

  {name:"moksedul",code:"8614"},

  {name:"rayhan",code:"4378"},

  {name:"tisa",code:"6903"},

  {name:"saalma",code:"1526"},

  {name:"pritha",code:"8054"},

  {name:"kabbo",code:"3749"},

  {name:"rafi",code:"9261"},

  {name:"Sabir",code:"5187"},

  {name:"Jesika",code:"2634"},

  {name:"kabbo",code:"7315"},

  {name:"kaaabbo",code:"6492"}

];


/* Science-এর বিষয় */

const science = [

  "বাংলা ১ম পত্র",

  "বাংলা ২য় পত্র",

  "English 1st Paper",

  "English 2nd Paper",

  "গণিত",

  "ICT",

  "পদার্থবিজ্ঞান",

  "রসায়ন",

  "জীববিজ্ঞান",

  "উচ্চতর গণিত"

];


/* Arts-এর বিষয় */

const arts = [

  "বাংলা ১ম পত্র",

  "বাংলা ২য় পত্র",

  "English 1st Paper",

  "English 2nd Paper",

  "গণিত",

  "ICT",

  "ইতিহাস",

  "ভূগোল",

  "পৌরনীতি ও নাগরিকতা",

  "অর্থনীতি"

];


/* রেজাল্ট দেখানো */

function showResult(){

  const type =
  document.getElementById("type").value;

  const dept =
  document.getElementById("dept").value;

  const name =
  document.getElementById("name")
  .value
  .trim()
  .toLowerCase();

  const code =
  document.getElementById("code")
  .value
  .trim();


  const msg =
  document.getElementById("msg");

  const result =
  document.getElementById("result");


  /* প্রতিষ্ঠান/বিভাগ নির্বাচন */

  if(type !== "School" || !dept){

    msg.textContent =
    "প্রথমে School ও বিভাগ নির্বাচন করুন।";

    return;

  }


  /* শিক্ষার্থী খোঁজা */

  const student =
  students.find(function(x){

    return x.name.toLowerCase() === name
    && x.code === code;

  });


  /* ভুল নাম/কোড */

  if(!student){

    result.style.display = "none";

    msg.textContent =
    "নাম বা কোড সঠিক নয়।";

    return;

  }


  /* বিভাগ অনুযায়ী বিষয় */

  const subjects =
  dept === "Science"
  ? science
  : arts;


  let html = "";


  html += `
  <tr>
    <td>নাম</td>
    <td>${student.name}</td>
  </tr>
  `;


  html += `
  <tr>
    <td>রেজাল্ট কোড</td>
    <td>${student.code}</td>
  </tr>
  `;


  /* সব নম্বর ০০ */

  subjects.forEach(function(subject){

    html += `
    <tr>
      <td>${subject}</td>
      <td>০০</td>
    </tr>
    `;

  });


  /* মোট */

  html += `
  <tr>
    <td>মোট নম্বর</td>
    <td>০০ / ${subjects.length * 100}</td>
  </tr>
  `;


  /* গ্রেড */

  html += `
  <tr>
    <td>গ্রেড</td>
    <td>F</td>
  </tr>
  `;


  document.getElementById("marks")
  .innerHTML = html;


  result.style.display = "block";

  msg.textContent = "";

}

</script>

</body>
</html>
