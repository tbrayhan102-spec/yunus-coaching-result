<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Yunus Coaching - Result Portal</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f3f6fb;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  color:#18243a;
}

.container{
  max-width:520px;
  margin:30px auto;
  padding:15px;
}

.card{
  background:white;
  border-radius:25px;
  padding:35px 30px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}

h1{
  text-align:center;
  margin:0;
  font-size:38px;
}

.subtitle{
  text-align:center;
  color:#667085;
  font-size:22px;
  margin:8px 0 45px;
}

label{
  display:block;
  font-size:25px;
  font-weight:bold;
  margin:22px 0 10px;
}

input{
  width:100%;
  padding:18px;
  border:1px solid #d0d5dd;
  border-radius:18px;
  font-size:22px;
  outline:none;
}

input:focus{
  border-color:#2563eb;
}

button{
  width:100%;
  margin-top:30px;
  padding:19px;
  border:0;
  border-radius:18px;
  background:#2563eb;
  color:white;
  font-size:25px;
  font-weight:bold;
}

button:active{
  transform:scale(.98);
}

#error{
  display:none;
  text-align:center;
  color:#d92d20;
  margin-top:20px;
  font-size:18px;
  font-weight:bold;
}

#result{
  display:none;
  margin-top:25px;
  padding:25px;
  border-radius:18px;
  background:#f0fdf4;
  border:1px solid #86efac;
}

#result h2{
  text-align:center;
  margin-top:0;
}

.result-row{
  padding:10px 0;
  border-bottom:1px solid #d1fae5;
  font-size:19px;
}

.result-row:last-child{
  border-bottom:0;
}
</style>
</head>

<body>

<div class="container">

  <div class="card">

    <h1>Yunus Coaching</h1>

    <div class="subtitle">
      Result Portal
    </div>

    <label>শিক্ষার্থীর নাম</label>

    <input
      type="text"
      id="name"
      placeholder="নাম লিখুন"
    >

    <label>রেজাল্ট কোড</label>

    <input
      type="text"
      id="code"
      placeholder="কোড লিখুন"
    >

    <button onclick="showResult()">
      রেজাল্ট দেখুন
    </button>

    <div id="error">
      নাম অথবা রেজাল্ট কোড সঠিক নয়।
    </div>

    <div id="result">

      <h2>🎓 রেজাল্ট</h2>

      <div class="result-row">
        <b>নাম:</b> <span id="rName"></span>
      </div>

      <div class="result-row">
        <b>রেজাল্ট কোড:</b> <span id="rCode"></span>
      </div>

      <div class="result-row">
        <b>বাংলা:</b> <span id="bangla"></span>
      </div>

      <div class="result-row">
        <b>ইংরেজি:</b> <span id="english"></span>
      </div>

      <div class="result-row">
        <b>গণিত:</b> <span id="math"></span>
      </div>

      <div class="result-row">
        <b>বিজ্ঞান:</b> <span id="science"></span>
      </div>

      <div class="result-row">
        <b>মোট নম্বর:</b> <span id="total"></span>
      </div>

      <div class="result-row">
        <b>গ্রেড:</b> <span id="grade"></span>
      </div>

    </div>

  </div>

</div>

<script>

/* =========================
   শিক্ষার্থীদের রেজাল্ট
   ========================= */

const students = {

  "1001": {
    name: "রায়হান",
    bangla: 85,
    english: 80,
    math: 90,
    science: 88
  },

  "1002": {
    name: "করিম",
    bangla: 75,
    english: 78,
    math: 82,
    science: 80
  },

  "1003": {
    name: "রহিম",
    bangla: 90,
    english: 85,
    math: 95,
    science: 92
  }

};


/* =========================
   রেজাল্ট দেখানোর ফাংশন
   ========================= */

function showResult(){

  const name =
    document.getElementById("name").value.trim();

  const code =
    document.getElementById("code").value.trim();

  const error =
    document.getElementById("error");

  const result =
    document.getElementById("result");


  /* আগের রেজাল্ট লুকানো */

  result.style.display = "none";
  error.style.display = "none";


  /* কোড খোঁজা */

  const student = students[code];


  if(!student || student.name !== name){

    error.style.display = "block";

    return;
  }


  /* মোট নম্বর */

  const total =
    student.bangla +
    student.english +
    student.math +
    student.science;


  /* গ্রেড */

  const average = total / 4;

  let grade;

  if(average >= 80){
    grade = "A+";
  }
  else if(average >= 70){
    grade = "A";
  }
  else if(average >= 60){
    grade = "B";
  }
  else if(average >= 50){
    grade = "C";
  }
  else if(average >= 40){
    grade = "D";
  }
  else{
    grade = "F";
  }


  /* রেজাল্ট বসানো */

  document.getElementById("rName").textContent =
    student.name;

  document.getElementById("rCode").textContent =
    code;

  document.getElementById("bangla").textContent =
    student.bangla;

  document.getElementById("english").textContent =
    student.english;

  document.getElementById("math").textContent =
    student.math;

  document.getElementById("science").textContent =
    student.science;

  document.getElementById("total").textContent =
    total + " / 400";

  document.getElementById("grade").textContent =
    grade;


  /* রেজাল্ট দেখানো */

  result.style.display = "block";
}

</script>

</body>
      </html>
